[project]
name = "essay-writer"
version = "0.1.0"
description = "LangGraph Essay Writer with Ollama and DuckDuckGo search"
requires-python = ">=3.12"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "gradio>=6.17.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.4",
    "langgraph-checkpoint>=4.1.1",
    "pydantic>=2.13.4",
]
