[project]
name = "cs-langgraph"
version = "0.1.0"
description = "CS 상담 멀티에이전트 - LangGraph 구현"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "grandalf>=0.8",
]

[project.scripts]
chat = "cs_agent.main:chat"
plot = "cs_agent.main:plot"

[tool.hatch.build.targets.wheel]
packages = ["cs_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
